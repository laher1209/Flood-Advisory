<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>FloodSafe - Cross Platform React TSX Application</title>
    <!-- Tailwind CSS CDN for instant styling support without build steps -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                500: '#2563eb',
                600: '#1d4ed8',

          }
        }
      }

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
  </head>
  <body class="bg-slate-900 antialiased overflow-hidden">
