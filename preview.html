<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloodSafe - Cross-Platform Dashboard</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 900: '#0b192c' }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; overflow: hidden; height: 100vh; }

    /* Custom scrollbars */
    .scroll-area { overflow-y: auto; overflow-x: hidden; }
    .scroll-area::-webkit-scrollbar { width: 5px; }
    .scroll-area::-webkit-scrollbar-track { background: #f1f5f9; }
    .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .mobile-scroll::-webkit-scrollbar { display: none; }

    /* Map styles */
    .map-canvas-bg {
      background-color: #e5ece5;
      background-image:
        radial-gradient(#c8d8c8 1.5px, transparent 1.5px),
        linear-gradient(to right, rgba(210,222,210,0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(210,222,210,0.4) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
      position: relative;
    }
    .river-path {
      position: absolute; width: 140%; height: 70px;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #2563eb 100%);
      transform: rotate(38deg); top: 35%; left: -20%; opacity: 0.65;
      filter: blur(1px); border-radius: 40px;
    }
    .heatmap-severe {
      background: radial-gradient(circle, rgba(239,68,68,0.75) 0%, rgba(249,115,22,0.6) 45%, rgba(234,179,8,0.35) 70%, transparent 100%);
      filter: blur(2px);
    }

    /* Animations */
    @keyframes pulse-ring { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:0.6} }
    .pulse-ring { animation: pulse-ring 1.5s ease-in-out infinite; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes ping { 0%{transform:scale(1);opacity:1} 75%,100%{transform:scale(2);opacity:0} }
    .animate-ping { animation: ping 1s cubic-bezier(0,0,0.2,1) infinite; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: #0f172a; color: #fff;
      font-size: 12px; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 360px; }

    /* Page layout */
    .app-layout { display: flex; height: 100vh; width: 100%; }
    .sidebar { width: 256px; min-width: 256px; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
    .main-area { flex: 1; min-width: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .page-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px; }
    .page-content::-webkit-scrollbar { width: 5px; }
    .page-content::-webkit-scrollbar-track { background: #f1f5f9; }
    .page-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    /* Mobile shell */
    .mobile-shell { -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

/* ────────────────────────────────── DATA ────────────────────────────────── */
const SIDEBAR_ITEMS = [
  { id: 'dashboard',  label: 'Dashboard',       icon: '🏠' },
  { id: 'map',        label: 'Map View',         icon: '🗺️' },
  { id: 'alerts',     label: 'Alerts',           icon: '🚨' },
  { id: 'shelters',   label: 'Shelters Nearby',  icon: '🏫' },
  { id: 'route',      label: 'Best Route',       icon: '🧭' },
  { id: 'forecast',   label: 'Forecast',         icon: '🌤️' },
  { id: 'risk-zones', label: 'Risk Zones',       icon: '⚠️' },
  { id: 'emergency',  label: 'Emergency Info',   icon: 'ℹ️' },
  { id: 'settings',   label: 'Settings',         icon: '⚙️' },
];

const ALERTS = [
  { id:1, title:'High Water Level Alert', location:'Riverside Area', time:'2 hours ago', severity:'red', desc:'Water levels have exceeded the danger threshold of 8.5m. Immediate evacuation advised for riverside zones.' },
  { id:2, title:'Flash Flood Warning', location:'Green Park', time:'4 hours ago', severity:'amber', desc:'Rapid onset flooding predicted within the next 2 hours. Residents should move to higher ground immediately.' },
  { id:3, title:'Heavy Rainfall Forecast', location:'Kailash Nagar', time:'6 hours ago', severity:'blue', desc:'Forecast shows 180mm rainfall in 24 hours. Drains and low-lying areas are at high risk of overflow.' },
  { id:4, title:'River Level Rising', location:'Main River (Sector 3)', time:'8 hours ago', severity:'cyan', desc:'Steady rise of 0.3m/hour observed. Monitoring teams deployed. Potential flood alert in 6–8 hours.' },
  { id:5, title:'Evacuation Order Issued', location:'Sunset Colony', time:'12 hours ago', severity:'red', desc:'Mandatory evacuation order for Sunset Colony blocks A–D. Buses dispatched. Report to Govt High School.' },
];

const SHELTERS = [
  { id:1, name:'Government High School', distance:'1.2 km', capacity:200, occupied:140, status:'Open', lat:'30.9010', lng:'75.8573' },
  { id:2, name:'Community Hall Center', distance:'2.8 km', capacity:150, occupied:60, status:'Open', lat:'30.9080', lng:'75.8620' },
  { id:3, name:'District Sports Complex', distance:'4.1 km', capacity:350, occupied:120, status:'Open', lat:'30.8990', lng:'75.8490' },
  { id:4, name:'Municipal Corporation Hall', distance:'5.3 km', capacity:180, occupied:178, status:'Near Full', lat:'30.9130', lng:'75.8710' },
  { id:5, name:'Model Town Community Centre', distance:'6.8 km', capacity:120, occupied:0, status:'Standby', lat:'30.8950', lng:'75.8450' },
];

const FORECAST = [
  { day:'Mon', date:'14 Jul', emoji:'🌧️', high:31, low:24, rain:'85%', desc:'Heavy Rain', wind:'18 km/h' },
  { day:'Tue', date:'15 Jul', emoji:'⛈️', high:28, low:22, rain:'92%', desc:'Thunderstorm', wind:'25 km/h' },
  { day:'Wed', date:'16 Jul', emoji:'🌦️', high:29, low:23, rain:'60%', desc:'Showers', wind:'15 km/h' },
  { day:'Thu', date:'17 Jul', emoji:'🌧️', high:27, low:21, rain:'78%', desc:'Heavy Rain', wind:'20 km/h' },
  { day:'Fri', date:'18 Jul', emoji:'⛅', high:30, low:22, rain:'30%', desc:'Partly Cloudy', wind:'12 km/h' },
  { day:'Sat', date:'19 Jul', emoji:'🌤️', high:33, low:24, rain:'15%', desc:'Mostly Sunny', wind:'10 km/h' },
  { day:'Sun', date:'20 Jul', emoji:'☀️', high:35, low:25, rain:'5%', desc:'Clear Sky', wind:'8 km/h' },
];

const RISK_ZONES = [
  { id:1, zone:'Riverside Sector A', risk:'Severe', color:'red', desc:'Active flooding. Do not enter.', affected: 2340 },
  { id:2, zone:'Green Park Block B', risk:'High', color:'orange', desc:'Flood risk within 6 hours.', affected: 1200 },
  { id:3, zone:'Kailash Nagar', risk:'Moderate', color:'amber', desc:'Monitor closely. Prepare to evacuate.', affected: 890 },
  { id:4, zone:'Sunset Colony', risk:'Moderate', color:'amber', desc:'Water accumulation detected in streets.', affected: 760 },
  { id:5, zone:'Model Town Phase 2', risk:'Low', color:'emerald', desc:'No immediate threat. Stay alert.', affected: 0 },
  { id:6, zone:'Sector 9 Extension', risk:'Low', color:'emerald', desc:'Safe zone. Evacuation not required.', affected: 0 },
];

const EMERGENCY_CONTACTS = [
  { id:1, emoji:'🚨', title:'Disaster Management Helpline', desc:'24/7 Government Emergency Line', phone:'112', color:'red' },
  { id:2, emoji:'🚑', title:'Medical Evacuation (Ambulance)', desc:'Emergency Medical Services', phone:'108', color:'emerald' },
  { id:3, emoji:'🚤', title:'Flood Boat Rescue', desc:'NDRF Water Rescue Operations', phone:'1077', color:'blue' },
  { id:4, emoji:'🔥', title:'Fire & Rescue Services', desc:'Fire Department Emergency', phone:'101', color:'orange' },
  { id:5, emoji:'👮', title:'Police Control Room', desc:'Law Enforcement Emergency', phone:'100', color:'purple' },
  { id:6, emoji:'🏥', title:'Blood Bank & Hospital', desc:'Civil Hospital Ludhiana', phone:'0161-2402345', color:'pink' },
];

/* ─────────────────────────────── SHARED COMPONENTS ──────────────────────── */

function SectionCard({ title, subtitle, children, action, onAction }) {
  return (
    <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 className="font-bold text-slate-800 text-sm">{title}</h2>
          {subtitle && <p className="text-[11px] text-slate-400 mt-0.5">{subtitle}</p>}
        </div>
        {action && (
          <button onClick={onAction} className="text-xs text-blue-600 font-semibold hover:text-blue-700">{action} →</button>
        )}
      </div>
      <div className="p-5">{children}</div>
    </div>
  );
}

function Badge({ color, children }) {
  const colors = {
    red: 'bg-red-100 text-red-700', amber: 'bg-amber-100 text-amber-700',
    orange: 'bg-orange-100 text-orange-700', emerald: 'bg-emerald-100 text-emerald-700',
    blue: 'bg-blue-100 text-blue-700', cyan: 'bg-cyan-100 text-cyan-700',
    purple: 'bg-purple-100 text-purple-700', pink: 'bg-pink-100 text-pink-700',
  };
  return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold ${colors[color] || colors.blue}`}>{children}</span>;
}

/* ────────────────────── WEB PAGES ───────────────────── */

function DashboardPage({ onNavigate, onNotify }) {
  return (
    <div className="space-y-6 fade-in pb-8">
      {/* Greeting */}
      <div>
        <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
          Good Morning, Adeel <span className="text-2xl">👋</span>
        </h2>
        <p className="text-xs text-slate-500 mt-0.5">Here's the latest flood information for your area — Mon, 14 Jul 2025</p>
      </div>

      {/* Metric Cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label:'Active Alerts', value:3, icon:'🚨', color:'red', action:'View Alerts', tab:'alerts' },
          { label:'Affected Areas', value:5, icon:'🗺️', color:'amber', action:'View Map', tab:'map' },
          { label:'Rising Water Levels', value:2, icon:'📈', color:'blue', action:'Check Details', tab:'risk-zones' },
          { label:'Safe Zones', value:12, icon:'🛡️', color:'emerald', action:'View Locations', tab:'shelters' },
        ].map((c, i) => (
          <div key={i} className="bg-white rounded-xl p-4 border border-slate-100 shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
            <div className="flex items-center justify-between">
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg
                ${c.color==='red'?'bg-red-50':c.color==='amber'?'bg-amber-50':c.color==='blue'?'bg-blue-50':'bg-emerald-50'}`}>
                {c.icon}
              </div>
              <span className="text-2xl font-extrabold text-slate-900">{c.value}</span>
            </div>
            <div className="mt-3">
              <h5 className="text-xs font-semibold text-slate-600">{c.label}</h5>
              <button onClick={() => onNavigate(c.tab)} className={`text-[11px] font-bold mt-1 flex items-center gap-1
                ${c.color==='red'?'text-red-600':c.color==='amber'?'text-amber-600':c.color==='blue'?'text-blue-600':'text-emerald-600'}`}>
                {c.action} →
              </button>
            </div>
          </div>
        ))}
      </div>

      {/* Map + Alerts + Forecast Grid */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Map Widget */}
        <div className="lg:col-span-8 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col" style={{height:'420px'}}>
          <div className="p-3.5 border-b border-slate-100 flex items-center justify-between">
            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
              <span className="px-3 py-1 bg-white text-blue-600 text-xs font-semibold rounded shadow-sm">Map View</span>
              <button onClick={() => onNavigate('map')} className="px-3 py-1 text-slate-500 text-xs font-medium rounded hover:bg-slate-50">Full Map →</button>
            </div>
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-red-50 text-red-600 border border-red-100">
              <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span> Live Sensor Feed
            </span>
          </div>
          <div className="relative flex-1 map-canvas-bg overflow-hidden">
            <div className="river-path"></div>
            <div className="absolute text-[11px] font-bold tracking-widest text-blue-900/60 rotate-45 select-none" style={{top:'45%',right:'22%'}}>RIVER GANGA</div>
            <div className="heatmap-severe absolute w-64 h-64 rounded-full" style={{top:'6rem',left:'12rem'}}></div>
            <svg className="absolute inset-0 w-full h-full pointer-events-none">
              <path d="M 120 220 Q 200 190 280 230 T 420 180" fill="none" stroke="#2563eb" strokeDasharray="6,4" strokeLinecap="round" strokeWidth="4"/>
              <circle cx="120" cy="220" fill="#2563eb" r="5"/>
              <circle cx="420" cy="180" fill="#dc2626" r="5"/>
            </svg>
            {[
              { label:'Riverside', top:80, left:112, bg:'bg-blue-600', type:'loc' },
              { label:'Green Park', top:64, right:144, bg:'bg-emerald-600', type:'safe' },
              { label:'Sunset Colony', bottom:112, left:160, bg:'bg-blue-600', type:'dot' },
              { label:'Kailash Nagar', bottom:48, right:192, bg:'bg-blue-600', type:'dot' },
            ].map((m, i) => (
              <div key={i} onClick={() => onNotify(`Selected: ${m.label}`)}
                className="absolute flex flex-col items-center cursor-pointer group"
                style={{ top: m.top, left: m.left, right: m.right, bottom: m.bottom }}>
                <span className="bg-white/90 text-[10px] font-semibold text-slate-700 px-2 py-0.5 rounded shadow-sm mb-1 group-hover:bg-blue-50 transition-colors">{m.label}</span>
                <div className={`${m.type==='dot'?'w-6 h-6':'w-7 h-7'} rounded-full ${m.bg} text-white flex items-center justify-center shadow-lg border-2 border-white group-hover:scale-110 transition-transform`}>
                  {m.type==='safe'?'🛡️':m.type==='dot'?<div className="w-2 h-2 rounded-full bg-white"/>:'📍'}
                </div>
              </div>
            ))}
            {/* High Hazard */}
            <div onClick={() => onNotify('⚠️ HIGH HAZARD — Immediate Risk Zone')} className="absolute flex flex-col items-center cursor-pointer" style={{top:176,left:288}}>
              <div className="w-9 h-9 rounded-full bg-red-600 text-white flex items-center justify-center shadow-xl border-2 border-white pulse-ring text-base">⚠️</div>
            </div>
            {/* Legend */}
            <div className="absolute bottom-4 left-4 bg-white/95 backdrop-blur p-3 rounded-xl border border-slate-200 shadow-md w-40 z-10">
              <span className="text-[10px] font-bold text-slate-700 uppercase tracking-wider block mb-1.5">Flood Risk Level</span>
              {[['bg-emerald-500','Low'],['bg-amber-400','Moderate'],['bg-orange-500','High'],['bg-red-600','Severe']].map(([bg,label]) => (
                <div key={label} className="flex items-center gap-2 text-[11px] text-slate-600 mb-1">
                  <span className={`w-2.5 h-2.5 rounded-full ${bg}`}></span>{label}
                </div>
              ))}
            </div>
            {/* Zoom Controls */}
            <div className="absolute right-4 bottom-4 flex flex-col bg-white rounded-lg shadow-lg border border-slate-200 overflow-hidden divide-y divide-slate-100 z-10">
              {['+','−','📍'].map((c, i) => (
                <button key={i} onClick={() => onNotify(c === '📍' ? 'Location reset' : `Zoom ${c}`)}
                  className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-50 text-sm font-bold">{c}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Alerts + Forecast */}
        <div className="lg:col-span-4 flex flex-col gap-5">
          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 flex-1">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-2">
              <h3 className="font-bold text-sm text-slate-800">Recent Alerts</h3>
              <button onClick={() => onNavigate('alerts')} className="text-xs text-blue-600 font-semibold hover:text-blue-700">View all →</button>
            </div>
            <div className="divide-y divide-slate-100">
              {ALERTS.slice(0,4).map(a => (
                <div key={a.id} onClick={() => onNavigate('alerts')} className="py-2.5 flex items-start gap-3 cursor-pointer hover:bg-slate-50 rounded-lg px-1 transition-colors">
                  <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs shrink-0 mt-0.5
                    ${a.severity==='red'?'bg-red-100':a.severity==='amber'?'bg-amber-100':a.severity==='blue'?'bg-blue-100':'bg-cyan-100'}`}>

                  <div className="flex-1 min-w-0">
                    <p className="text-xs font-semibold text-slate-800 truncate">{a.title}</p>
                    <p className="text-[11px] text-slate-500">{a.location} • {a.time}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-bold text-sm text-slate-800">7-Day Forecast</h3>
              <button onClick={() => onNavigate('forecast')} className="text-xs text-blue-600 font-semibold hover:text-blue-700">Details →</button>
            </div>
            <div className="grid grid-cols-7 gap-1 text-center">
              {FORECAST.map((f, i) => (
                <div key={i} onClick={() => onNavigate('forecast')} className="flex flex-col items-center p-1 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <span className="text-[11px] text-slate-400 font-medium">{f.day}</span>
                  <span className="text-base my-1">{f.emoji}</span>
                  <span className="text-xs font-bold text-slate-700">{f.high}°</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Bottom Panels */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        {/* Shelters */}
        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
          <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
            <div className="flex items-center gap-2">
              <span className="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">🏫</span>
              <div><h4 className="text-sm font-bold text-slate-800">Nearest Shelters</h4><p className="text-[11px] text-slate-400">Evacuation centers</p></div>
            </div>
            <button onClick={() => onNavigate('shelters')} className="text-xs text-blue-600 font-semibold">View All</button>
          </div>
          <div className="space-y-3">
            {SHELTERS.slice(0,2).map(s => (
              <div key={s.id} className="bg-slate-50 p-3 rounded-xl flex items-center justify-between">
                <div>
                  <h5 className="text-xs font-bold text-slate-800">{s.name}</h5>
                  <p className="text-[11px] text-slate-500">{s.distance} • Capacity: {s.capacity}</p>
                  <Badge color="emerald">{s.status}</Badge>
                </div>
                <button onClick={() => onNavigate('route')} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">Route</button>
              </div>
            ))}
          </div>
        </div>

        {/* Route Planner */}
        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
          <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
            <div className="flex items-center gap-2">
              <span className="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center">🧭</span>
              <div><h4 className="text-sm font-bold text-slate-800">Best Route Guidance</h4><p className="text-[11px] text-slate-400">Avoid flooded paths</p></div>
            </div>
            <Badge color="emerald">Live</Badge>
          </div>
          <div className="space-y-2 text-xs">
            <div className="flex items-center gap-2 text-slate-600"><span className="w-2 h-2 rounded-full bg-blue-600"></span><span>From: <strong>Sector 4, Model Town</strong></span></div>
            <div className="flex items-center gap-2 text-slate-600"><span className="w-2 h-2 rounded-full bg-emerald-500"></span><span>To: <strong>Govt High School (1.2 km)</strong></span></div>
            <div className="p-2.5 bg-blue-50/80 border border-blue-100 rounded-xl flex items-center justify-between mt-2">
              <div><div className="font-bold text-blue-900">Recommended: High Ground Route</div><div className="text-[11px] text-blue-600 mt-0.5">Avoids Riverside flood zone</div></div>
              <span className="font-bold text-blue-800 text-sm">6 min</span>
            </div>
            <button onClick={() => onNavigate('route')} className="w-full mt-2 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-xs transition-colors">Start Safe Navigation</button>
          </div>
        </div>

        {/* Emergency Contacts */}
        <div className="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
          <div className="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
            <div className="flex items-center gap-2">
              <span className="w-8 h-8 rounded-lg bg-red-50 flex items-center justify-center">📞</span>
              <div><h4 className="text-sm font-bold text-slate-800">Emergency Assistance</h4><p className="text-[11px] text-slate-400">Disaster response</p></div>
            </div>
            <span className="text-[11px] font-bold text-red-600">24/7</span>

            <div style={{flex:'0 0 62%',borderRight:'2px solid #1e293b',overflow:'hidden',display:'flex',flexDirection:'column'}}>
              <div style={{background:'#0f172a',padding:'4px 12px',fontSize:10,color:'#60a5fa',fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:'#3b82f6',display:'inline-block'}}></span>Web Dashboard Viewport
              </div>
              <div style={{flex:1,overflow:'hidden'}}><WebDashboard onNotify={notify} /></div>
            </div>
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',background:'#0f172a',overflow:'hidden'}}>
              <div style={{width:'100%',padding:'4px 12px',fontSize:10,color:'#34d399',fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:'#10b981',display:'inline-block'}}></span>Android Mobile Viewport
              </div>
              <div style={{flex:1,width:'100%',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <MobileApp onNotify={notify} />
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Toast Notification */}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
